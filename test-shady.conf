# Master switch. When false, F4 cannot enable window physics.
physics_enabled = true
# Initial gravity state when physics is enabled.
window_gravity = true
window_wobble = true
window_sides = true
shadows = true
floor = true
close_animation = true
fps_mode = true
sky = true

sky_path = /home/jihoo/shady/sky.ppm
environment = true
environment_path = /home/jihoo/shady/assets/test-room.obj
# Key bindings. Modifiers: Alt, Shift, Ctrl, Super.
# Key names use XKB names such as F2, Escape, Left, q, equal and minus.
bind.quit = Escape
bind.cycle_windows = F1
bind.close_window = Alt+F11
bind.fps_toggle = F2
bind.fps_capture = F3
bind.gravity_toggle = F4
bind.camera_left = Alt+Left
bind.camera_right = Alt+Right
bind.camera_up = Alt+Up
bind.camera_down = Alt+Down
bind.camera_yaw_left = Alt+q
bind.camera_yaw_right = Alt+e
bind.camera_zoom_in = Alt+equal
bind.camera_zoom_out = Alt+minus
bind.camera_reset = Alt+0
