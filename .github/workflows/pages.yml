name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "website/**"
      - "docs/**"
      - "examples/rice/astral-loom/hero.png"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Check Astro site
        working-directory: website
        run: npm run check

      - name: Build static site
        working-directory: website
        run: npm run build

      - name: Apply GitHub Pages base path
        if: steps.pages.outputs.base_path != ''
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          base = os.environ["BASE_PATH"].rstrip("/")
          root = Path("website/dist")

          for path in root.rglob("*"):
              if not path.is_file():
                  continue

              if path.suffix == ".html":
                  text = path.read_text(encoding="utf-8")
                  for attr in ("href", "src", "srcset", "action"):
                      text = text.replace(f'{attr}="/', f'{attr}="{base}/')
                  path.write_text(text, encoding="utf-8")

              elif path.suffix == ".css":
                  text = path.read_text(encoding="utf-8")
                  text = text.replace("url(/", f"url({base}/")
                  path.write_text(text, encoding="utf-8")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
