name: Deploy website to GitHub Pages

# The site's source is gloaming-dusk/shady-website; it renders this
# repository's docs/ and rice images. It deploys from here so it stays at
# https://gloaming-dusk.github.io/shady/. A docs or preview change deploys on
# push; a shady-website change deploys on the daily run or by running this
# workflow by hand.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "docs/**"
      - "rices/*/preview.jpg"
      - "rices/afterglow/*.jpg"
      - "rices/afterglow/hero.*"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the website
        uses: actions/checkout@v4
        with:
          repository: gloaming-dusk/shady-website

      - name: Checkout Shady
        uses: actions/checkout@v4
        with:
          path: shady

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Astro site
        run: npm run check

      - name: Build static site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build

      - name: Apply GitHub Pages base path
        if: steps.pages.outputs.base_path != ''
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          base = os.environ["BASE_PATH"].rstrip("/")
          root = Path("dist")

          for path in root.rglob("*"):
              if not path.is_file():
                  continue

              if path.suffix == ".html":
                  text = path.read_text(encoding="utf-8")
                  for attr in ("href", "src", "srcset", "action", "poster"):
                      text = text.replace(f'{attr}="/', f'{attr}="{base}/')
                  path.write_text(text, encoding="utf-8")

              elif path.suffix == ".css":
                  text = path.read_text(encoding="utf-8")
                  text = text.replace("url(/", f"url({base}/")
                  path.write_text(text, encoding="utf-8")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
