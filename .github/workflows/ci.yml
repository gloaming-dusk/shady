name: CI

# Builds the package (its meson tests run as part of the build). The
# ASan/UBSan spatial suite needs a DRM render node, which the runners lack;
# run it locally with ./tests/spatial-suite.sh.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Build and unit-test the package
        run: nix build -L .#default
      - name: Build the nix run app
        run: nix build -L --no-link .#apps.x86_64-linux.default.program
